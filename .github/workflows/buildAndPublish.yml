name: Build and Publish

on:
  pull_request:
    branches:
      - main
      - develop
      - 123974-refactor-adr-retrieval
    paths:
      - 'ai-code-review/**'
      - '.github/workflows/pr-check.yml'

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ai-code-review/package-lock.json

      - name: Install dependencies
        working-directory: ./ai-code-review
        run: npm ci

      - name: Build
        working-directory: ./ai-code-review
        run: npm run build

      - name: Run tests
        working-directory: ./ai-code-review
        run: npm run test -- --run

      - name: Install tfx-cli (Azure DevOps cli)
        if: github.ref == 'refs/heads/main'
        run: npm install -g tfx-cli

      - name: Publish to Azure DevOps Marketplace
        if: github.ref == 'refs/heads/main'
        run: tfx extension publish --manifest-globs vss-extension.json
